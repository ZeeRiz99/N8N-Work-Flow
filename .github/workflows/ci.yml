name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: replyline_app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: replyline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U replyline_app -d replyline_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://replyline_app:ci-only-password@127.0.0.1:5432/replyline_test
      OUTBOX_DISPATCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Database extensions
        run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U replyline_app -d replyline_test \
            -c "CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (database tests must run, not skip)
        run: pytest -rs | tee pytest.log && ! grep -q "SKIPPED" pytest.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.0" # same version as the pre-commit hook
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
